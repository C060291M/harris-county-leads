name: StackIQ Tyler iDS Group E

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days to look back'
        default: '3'
      max_pages:
        description: 'Max pages per doc type'
        default: '5'

jobs:

  lubbock:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run lubbock scraper
        run: python scraper/multi_county_lubbock.py
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
      - name: Push to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scraper/push_to_db.py
