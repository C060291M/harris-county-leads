name: StackIQ Tyler Universal Scraper

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  henderson:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: playwright install chromium --with-deps
      - name: Scrape Henderson
        run: python scraper/tyler_universal.py
        env:
          COUNTY_NAME: "Henderson"
          BASE_URL: "https://hendersoncountytx-web.tylerhost.net/web"
          LOOKBACK_DAYS: "3"
      - name: Push to DB
        run: python scraper/push_to_db.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JSON_GLOB: "dashboard/henderson_records.json"
        if: always()

