name: StackIQ Bexar + Hidalgo Advanced Scrapers
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days to look back'
        default: '3'
jobs:
  bexar:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Bexar scraper
        run: python scraper/scrape_bexar_hidalgo_adv.py
        env:
          COUNTY: "bexar"
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
      - name: Push to DB
        run: python scraper/push_to_db.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
  hidalgo:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Hidalgo scraper
        run: python scraper/scrape_bexar_hidalgo_adv.py
        env:
          COUNTY: "hidalgo"
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
      - name: Push to DB
        run: python scraper/push_to_db.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
