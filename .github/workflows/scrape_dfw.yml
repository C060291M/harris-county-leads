name: StackIQ DFW Scrapers

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days to look back'
        default: '3'
      max_pages:
        description: 'Max pages per doc type'
        default: '3'

jobs:

  collin:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run collin scraper
        run: python scraper/multi_county_1b.py
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
      - name: Push to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scraper/push_to_db.py

  denton-group:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run denton-group scraper
        run: python scraper/multi_county_2.py
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
      - name: Push to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scraper/push_to_db.py

