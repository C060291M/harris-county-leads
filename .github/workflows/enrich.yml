name: Enrich Leads
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
jobs:
  enrich:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install psycopg2-binary requests python-dotenv

      - name: Run CAD bulk enrichment
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-cad" \
            -H "Content-Type: application/json" --max-time 270 \
            -w "\nHTTP %{http_code}" || echo "enrich-cad failed"

      - name: Run esearch enrichment batch 1
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-esearch?limit=20" \
            -H "Content-Type: application/json" --max-time 270 \
            -w "\nHTTP %{http_code}" || echo "batch 1 failed"

      - name: Run esearch enrichment batch 2
        run: |
          sleep 10
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-esearch?limit=20" \
            -H "Content-Type: application/json" --max-time 270 \
            -w "\nHTTP %{http_code}" || echo "batch 2 failed"

      - name: Run esearch enrichment batch 3
        run: |
          sleep 10
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-esearch?limit=20" \
            -H "Content-Type: application/json" --max-time 270 \
            -w "\nHTTP %{http_code}" || echo "batch 3 failed"

      - name: Run esearch enrichment batch 4
        run: |
          sleep 10
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-esearch?limit=20" \
            -H "Content-Type: application/json" --max-time 270 \
            -w "\nHTTP %{http_code}" || echo "batch 4 failed"

      - name: Run esearch enrichment batch 5
        run: |
          sleep 10
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-esearch?limit=20" \
            -H "Content-Type: application/json" --max-time 270 \
            -w "\nHTTP %{http_code}" || echo "batch 5 failed"

      - name: Import Grayson CAD
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/import-grayson-cad" \
            -H "Content-Type: application/json" --max-time 3000 \
            -w "\nHTTP %{http_code}" || echo "Grayson import failed"

      - name: Import Johnson CAD
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/import-johnson-cad" \
            -H "Content-Type: application/json" --max-time 3000 \
            -w "\nHTTP %{http_code}" || echo "Johnson import failed"

      - name: Import Midland CAD
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/import-midland-cad" \
            -H "Content-Type: application/json" --max-time 3000 \
            -w "\nHTTP %{http_code}" || echo "Midland import failed"

      - name: Enrich Midland from CAD
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scraper/enrich_midland.py

      - name: Enrich Hidalgo via TrueProdigy API
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-hidalgo?limit=300" \
            -H "Content-Type: application/json" --max-time 270 \
            -w "\nHTTP %{http_code}" || echo "hidalgo enrich failed"

      - name: Rescore
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/rescore" \
            -H "Content-Type: application/json" --max-time 270 \
            -w "\nHTTP %{http_code}" || echo "rescore failed"