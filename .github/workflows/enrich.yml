# enrich.yml - light enrichment only, runs every 4 hours, NOT during scraper window
name: Enrich Leads
on:
  workflow_dispatch:
  schedule:
    - cron: "0 10,14,18,22 * * *"  # 10am, 2pm, 6pm, 10pm - never during 3-9am scraper window
jobs:
  enrich:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: CAD bulk enrichment
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-cad" \
            -H "Content-Type: application/json" --max-time 270 \
            -w "\nHTTP %{http_code}" || echo "enrich-cad failed"
      - name: Esearch enrichment
        run: |
          for i in 1 2 3; do
            curl -s -X POST "https://api.stackiq.org/api/admin/enrich-esearch?limit=20" \
              -H "Content-Type: application/json" --max-time 270 || echo "batch $i failed"
            sleep 15
          done
      - name: Hidalgo enrichment
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-hidalgo?limit=300" \
            -H "Content-Type: application/json" --max-time 270 || echo "hidalgo failed"
      - name: Rescore
        run: |
          sleep 30
          curl -s -X POST "https://api.stackiq.org/api/admin/rescore" \
            -H "Content-Type: application/json" --max-time 270 || echo "rescore failed"
