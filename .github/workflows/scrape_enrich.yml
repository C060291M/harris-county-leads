name: StackIQ Enrichment

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:

  enrich-esearch:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Run esearch enrichment
        run: |
          curl -s -X POST https://api.stackiq.org/api/admin/enrich-esearch \
            -H "Authorization: Bearer ${{ secrets.API_SECRET }}" || true
          curl -s -X POST https://api.stackiq.org/api/admin/enrich-cad \
            -H "Authorization: Bearer ${{ secrets.API_SECRET }}" || true

  email-alert:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Send email alert
        run: python scraper/email_alert.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        continue-on-error: true
