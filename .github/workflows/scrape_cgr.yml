name: StackIQ CGR Scraper
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}
jobs:
  waller:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install httpx beautifulsoup4 lxml psycopg2-binary
      - run: python scraper/multi_county_cgr.py
        env:
          COUNTY: "Waller"
          LOOKBACK_DAYS: "30"
          CGR_USER: ${{ secrets.CGR_USER }}
          CGR_PASS: ${{ secrets.CGR_PASS }}
      - run: python scraper/push_to_db.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
