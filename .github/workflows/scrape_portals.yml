name: StackIQ Portal Scrapers

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days to look back'
        default: '3'
      max_pages:
        description: 'Max pages per doc type'
        default: '5'

jobs:
  fort-bend:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Fort Bend County scraper (Aumentum)
        run: python scraper/multi_county_fort_bend.py
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
      - name: Push to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scraper/push_to_db.py
  webb:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Webb County scraper (Kofile GovOS)
        run: python scraper/multi_county_webb.py
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '8' }}
      - name: Push to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scraper/push_to_db.py
  galveston:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Galveston County scraper (Fidlar AVA)
        run: python scraper/multi_county_galveston.py
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '5' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
      - name: Push to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scraper/push_to_db.py
  parker:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Parker County scraper (Fidlar AVA)
        run: python scraper/multi_county_parker.py
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '5' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
      - name: Push to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scraper/push_to_db.py
  kerr:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Kerr County scraper (Fidlar AVA)
        run: python scraper/multi_county_kerr.py
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '5' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
      - name: Push to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scraper/push_to_db.py
  txlr:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Texas Land Records scraper (12 counties)
        run: python scraper/multi_county_txlr.py
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '5' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
      - name: Push to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scraper/push_to_db.py
  eagleweb:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Tyler EagleWeb scraper (Crane, Loving)
        run: python scraper/multi_county_eagleweb.py
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '5' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
      - name: Push to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scraper/push_to_db.py
  enrich-esearch:
    if: always()
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Run bulk CAD enrichment (bulk tables)
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-cad" -H "Content-Type: application/json" --max-time 300 -w "\nHTTP %{http_code}" || echo "Enrich-CAD failed"
      - name: Run esearch enrichment (50 leads per county)
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-esearch?limit=50" -H "Content-Type: application/json" --max-time 300 -w "\nHTTP %{http_code}" || echo "Enrich-esearch failed"
      - name: Rescore all leads
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/rescore" -H "Content-Type: application/json" --max-time 300 -w "\nHTTP %{http_code}" || echo "Rescore failed"

  email-alert:
    if: always()
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Trigger StackIQ alert emails
        run: |
          curl -s -X POST "https://api.stackiq.org/api/alerts/send" -H "Content-Type: application/json" -w "\nHTTP %{http_code}" || echo "Alert API call failed"

  deploy-pages:
    needs: harris
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/
      - id: deployment
        uses: actions/deploy-pages@v4
