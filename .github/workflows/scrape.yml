    if: always()
    steps:
      - name: Trigger StackIQ alert emails
        run: |
          curl -s -X POST "https://api.stackiq.org/api/alerts/send" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}" || echo "Alert API call failed"

  # â”€â”€ Deploy dashboard to GitHub Pages â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  deploy-pages:
    needs: harris
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/
      - id: deployment
        uses: actions/deploy-pages@v4
  