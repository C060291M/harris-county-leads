name: StackIQ Multi-County Scraper

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days to look back (3 = daily, 30 = monthly backfill, 365 = full backfill)"
        required: false
        default: "3"
        type: string
      max_pages:
        description: "Max pages per doc type (50 = daily, 500 = backfill)"
        required: false
        default: "50"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ── Harris County (SFTP) ────────────────────────────────────────────────────
  harris:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      hot_leads: ${{ steps.count.outputs.hot_leads }}
      total:     ${{ steps.count.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Harris scraper
        run: python scraper/fetch.py
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          LOOKBACK_DAYS: "3"
      - name: Count hot leads
        id: count
        run: |
          python3 - << 'PYEOF'
          import json, os
          try:
            with open("dashboard/records.json") as f:
              data = json.load(f)
            records = data.get("records", [])
            hot = [r for r in records if (r.get("score") or 0) >= 70 and "New this week" in (r.get("flags") or [])]
            total = len(records)
            print(f"Total: {total}, Hot new: {len(hot)}")
            with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"hot_leads={len(hot)}\n")
              out.write(f"total={total}\n")
          except Exception as e:
            print(f"Count error: {e}")
            with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("hot_leads=0\ntotal=0\n")
          PYEOF
      - name: Push Harris to DB
        run: |
          python3 - << 'PYEOF'
          import json, requests
          try:
            with open("dashboard/records.json") as f:
              payload = json.load(f)
            # Ensure all Harris records have county set
            records = payload.get("records", payload) if isinstance(payload, dict) else payload
            for r in records:
                if not r.get("county"):
                    r["county"] = "Harris"
            if isinstance(payload, dict):
                payload["records"] = records
            else:
                payload = records
            r = requests.post("https://api.stackiq.org/leads/bulk-import", json={"records": records} if isinstance(payload, list) else payload, timeout=120)
            print(f"Harris API: {r.status_code} {r.text[:200]}")
          except Exception as e:
            print(f"Push failed: {e}")
          PYEOF
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add dashboard/records.json data/records.json data/leads_ghl.csv dashboard/leadiq_stats.json data/leadiq_stats.json
          git diff --staged --quiet || git commit -m "chore: update harris leads [skip ci]"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-html
          path: debug/
          retention-days: 3

  # ── Dallas / Tarrant / Bexar ────────────────────────────────────────────────
  dallas-tarrant-bexar:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Dallas/Tarrant/Bexar scraper
        run: python scraper/multi_county.py
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '50' }}
      - name: Push to DB
        run: |
          python3 - << 'PYEOF'
          import json, requests, glob
          for f in glob.glob("dashboard/multi_county_records.json"):
            try:
              payload = json.load(open(f))
              r = requests.post("https://api.stackiq.org/leads/bulk-import", json=payload, timeout=180)
              print(f"{f}: {r.status_code} {r.text[:100]}")
            except Exception as e:
              print(f"Push failed: {e}")
          PYEOF

  # ── Collin ──────────────────────────────────────────────────────────────────
  collin:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Collin scraper
        run: python scraper/multi_county_1b.py
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '50' }}
      - name: Push to DB
        run: |
          python3 - << 'PYEOF'
          import json, requests, glob
          for f in glob.glob("dashboard/multi_county_1b_records.json"):
            try:
              payload = json.load(open(f))
              r = requests.post("https://api.stackiq.org/leads/bulk-import", json=payload, timeout=180)
              print(f"{f}: {r.status_code} {r.text[:100]}")
            except Exception as e:
              print(f"Push failed: {e}")
          PYEOF

  # ── Denton / Fort Bend / Montgomery / Williamson ────────────────────────────
  denton-group:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Denton group scraper
        run: python scraper/multi_county_2.py
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '50' }}
      - name: Push to DB
        run: |
          python3 - << 'PYEOF'
          import json, requests, glob
          for f in glob.glob("dashboard/multi_county_2_records.json"):
            try:
              payload = json.load(open(f))
              r = requests.post("https://api.stackiq.org/leads/bulk-import", json=payload, timeout=180)
              print(f"{f}: {r.status_code} {r.text[:100]}")
            except Exception as e:
              print(f"Push failed: {e}")
          PYEOF

  # ── Hidalgo / El Paso / Nueces / Jefferson ──────────────────────────────────
  south-texas:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run South Texas scraper
        run: python scraper/multi_county_3.py
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '50' }}
      - name: Push to DB
        run: |
          python3 - << 'PYEOF'
          import json, requests, glob
          for f in glob.glob("dashboard/multi_county_3_records.json"):
            try:
              payload = json.load(open(f))
              r = requests.post("https://api.stackiq.org/leads/bulk-import", json=payload, timeout=180)
              print(f"{f}: {r.status_code} {r.text[:100]}")
            except Exception as e:
              print(f"Push failed: {e}")
          PYEOF

  # ── Brazoria / Galveston / Brazos / Smith ───────────────────────────────────
  gulf-coast:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Gulf Coast scraper
        run: python scraper/multi_county_4.py
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '50' }}
      - name: Push to DB
        run: |
          python3 - << 'PYEOF'
          import json, requests, glob
          for f in glob.glob("dashboard/multi_county_4_records.json"):
            try:
              payload = json.load(open(f))
              r = requests.post("https://api.stackiq.org/leads/bulk-import", json=payload, timeout=180)
              print(f"{f}: {r.status_code} {r.text[:100]}")
            except Exception as e:
              print(f"Push failed: {e}")
          PYEOF

  # ── Travis / Lubbock / McLennan / Bell ─────────────────────────────────────
  central-texas:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Central Texas scraper
        run: python scraper/multi_county_5.py

  multi6:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run multi_county_6
        run: python scraper/multi_county_6.py
        env:
          LOOKBACK_DAYS: "3"
          API_URL: ${{ secrets.API_URL }}
        env:
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '3' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '50' }}
      - name: Push to DB
        run: |
          python3 - << 'PYEOF'
          import json, requests, glob
          for f in glob.glob("dashboard/multi_county_5_records.json"):
            try:
              payload = json.load(open(f))
              r = requests.post("https://api.stackiq.org/leads/bulk-import", json=payload, timeout=180)
              print(f"{f}: {r.status_code} {r.text[:100]}")
            except Exception as e:
              print(f"Push failed: {e}")
          PYEOF

  # ── CAD Enrichment (esearch for counties without bulk data) ─────────────────
  enrich-esearch:
    needs: [harris, dallas-tarrant-bexar, collin, denton-group, south-texas, gulf-coast, central-texas]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Run bulk CAD enrichment (bulk tables)
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-cad"             -H "Content-Type: application/json"             --max-time 300             -w "\nHTTP %{http_code}" || echo "Enrich-CAD failed"
      - name: Run esearch enrichment (50 leads per county)
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/enrich-esearch?limit=500"             -H "Content-Type: application/json"             --max-time 600             -w "\nHTTP %{http_code}" || echo "Enrich-esearch failed"
      - name: Rescore all leads
        run: |
          curl -s -X POST "https://api.stackiq.org/api/admin/rescore"             -H "Content-Type: application/json"             --max-time 300             -w "\nHTTP %{http_code}" || echo "Rescore failed"

  # ── Email alert ─────────────────────────────────────────────────────────────
  email-alert:
    needs: [harris, dallas-tarrant-bexar, collin, denton-group, south-texas, gulf-coast, central-texas]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Trigger StackIQ alert emails
        run: |
          curl -s -X POST "https://api.stackiq.org/api/alerts/send" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}" || echo "Alert API call failed"

  # ── Deploy dashboard to GitHub Pages ────────────────────────────────────────
  deploy-pages:
    needs: harris
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/
      - id: deployment
        uses: actions/deploy-pages@v4

