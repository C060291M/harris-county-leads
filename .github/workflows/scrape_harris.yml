name: StackIQ Harris Scraper

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Days to look back'
        default: '3'
      max_pages:
        description: 'Max pages per doc type'
        default: '5'

jobs:

  harris:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run Harris scraper
        run: python scraper/fetch.py
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          LOOKBACK_DAYS: "3"
      - name: Push Harris to DB
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scraper/push_to_db.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/ data/ || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: update Harris dashboard"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin main && break
            echo "Push attempt $i failed (likely a race with another workflow), retrying..."
            git rebase --abort || true
            sleep $((RANDOM % 15 + 5))
          done
